local head = tonumber(os.getenv('CONKY_HEAD') or '0') or 0
local pipe = io.popen("ip route show default 2>/dev/null | awk 'NR==1 {print $5}'")
local iface = pipe and pipe:read('*l') or nil
if pipe then pipe:close() end
if not iface or iface == '' then iface = 'lo' end

conky.config = {
    background = false,
    update_interval = 1.0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    double_buffer = true,
    no_buffers = true,
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=10',
    xftalpha = 1.0,
    override_utf8_locale = true,
    short_units = true,
    own_window = true,
    own_window_type = 'normal',
    own_window_hints = 'undecorated,sticky,below,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 205,
    own_window_colour = '170c32',
    own_window_class = 'ConkyDeck',
    own_window_title = 'conky-net',
    alignment = 'top_right',
    xinerama_head = head,
    gap_x = 18,
    gap_y = 52,
    minimum_width = 360,
    maximum_width = 360,
    border_inner_margin = 14,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    default_color = 'f3f4f5',
    color1 = 'f6019d',
    color2 = '2de2e6',
    color3 = '92406e',
    color4 = '62ff00',
    color8 = 'fba922',
    color9 = 'dd546e',
    default_graph_height = 48,
    default_graph_width = 332,
};

conky.text = [[
${font JetBrainsMono Nerd Font:bold:size=13}${color1}NET${alignr}${color2}]] .. iface .. [[${font}${color}
${color3}${hr 1}${color}
${color2}IPv4${alignr}${color}${addr ]] .. iface .. [[}
${color2}gateway${alignr}${color}${execi 30 ip route show default | awk 'NR==1 {print $3}'}
${color2}established TCP${alignr}${color}${tcp_portmon 1 65535 count}

${color4}DOWN${alignr}${color}${downspeed ]] .. iface .. [[}/s   ${totaldown ]] .. iface .. [[ total
${downspeedgraph ]] .. iface .. [[ 48,332 202146 62ff00 -t}
${color2}UP${alignr}${color}${upspeed ]] .. iface .. [[}/s   ${totalup ]] .. iface .. [[ total
${upspeedgraph ]] .. iface .. [[ 48,332 202146 2de2e6 -t}

${color1}SOCKETS${alignr}${color3}local host${color}
${color2}SSH${alignr}${color}${tcp_portmon 22 22 count}
${color2}HTTPS${alignr}${color}${tcp_portmon 443 443 count}
${color3}${alignc}${nodename} • ${monitor_number} monitor(s)${color}
]];
