name: Bootstrap unstable lockfile

on:
  push:
    branches:
      - agent/all-unstable

permissions:
  contents: write

concurrency:
  group: unstable-lock-bootstrap
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/all-unstable
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Regenerate lockfile from unstable inputs
        run: nix flake update
      - name: Commit updated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- flake.lock
          git commit -m "chore(flake): regenerate unstable inputs"
          git push origin HEAD:agent/all-unstable
