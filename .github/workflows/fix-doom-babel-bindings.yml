name: Fix Doom Babel bindings

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/fix-doom-babel-bindings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore original Babel bindings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '"o b t" #\'org-babel-tangle': '"b t" #\'org-babel-tangle',
              '"o b f" #\'format-elisp-src-blocks': '"b f" #\'format-elisp-src-blocks',
          }

          for filename in ('.doom.d/config.org', '.doom.d/config.el'):
              path = Path(filename)
              text = path.read_text()
              for old, new in replacements.items():
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected one {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .doom.d/config.org .doom.d/config.el
          git commit -m "Restore original Doom Babel bindings"
          git push origin HEAD:${{ github.head_ref }}
