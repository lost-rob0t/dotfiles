name: Prolog RLM tool

on:
  pull_request:
    paths:
      - "lisp/llm/ai-prolog-rlm.el"
      - "lisp/llm/prolog-rlm-bridge.pl"
      - "lisp/llm/ai-prolog-rlm-test.el"
      - "lisp/llm/ai-init.el"
      - ".github/scripts/check-prolog-rlm-bridge.sh"
      - ".github/workflows/prolog-rlm-tool.yml"
  push:
    branches:
      - master
      - "agent/**"
    paths:
      - "lisp/llm/ai-prolog-rlm.el"
      - "lisp/llm/prolog-rlm-bridge.pl"
      - "lisp/llm/ai-prolog-rlm-test.el"
      - "lisp/llm/ai-init.el"
      - ".github/scripts/check-prolog-rlm-bridge.sh"
      - ".github/workflows/prolog-rlm-tool.yml"

permissions:
  contents: read

jobs:
  prolog-rlm-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out researched prolog-rlm runtime
        run: |
          git clone --no-checkout https://github.com/lost-rob0t/prolog-rlm .ci/prolog-rlm
          git -C .ci/prolog-rlm checkout 4cdc9854a510a2d07b559e9ae34491d43d81301a

      - name: Check out tested gptel revision
        run: |
          git clone --no-checkout https://github.com/karthink/gptel .ci/gptel
          git -C .ci/gptel checkout dc0280821c344ec10547e13179ea2095f6165f05

      - name: Fetch Nix setup action from upstream
        run: git clone --depth 1 --branch v31 https://github.com/cachix/install-nix-action .github/ci-actions/install-nix
      - uses: ./.github/ci-actions/install-nix

      - name: Verify trusted SWI bridge
        run: |
          set -euo pipefail
          nix shell \
            github:NixOS/nixpkgs/nixos-26.05#swi-prolog \
            --command bash .github/scripts/check-prolog-rlm-bridge.sh

      - name: Run Emacs 30 adapter ERT tests
        run: |
          set -euo pipefail
          nix shell \
            github:NixOS/nixpkgs/nixos-26.05#emacs-nox \
            github:NixOS/nixpkgs/nixos-26.05#swi-prolog \
            --command emacs -Q --batch \
              -L .ci/gptel \
              -L lisp/llm \
              -l lisp/llm/ai-prolog-rlm-test.el \
              -f ert-run-tests-batch-and-exit
