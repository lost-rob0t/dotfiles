name: Resolve Zara plugin lock

on:
  push:
    branches:
      - gpt/zara-all-plugins-20260924

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Resolve zara-plugins input
        shell: bash
        run: |
          set -euo pipefail
          nix flake lock --update-input zara-plugins
          printf 'ZARA_FLAKE_LOCK_B64='
          base64 -w0 flake.lock
          printf '\n'
