name: Zara workflows

on:
  pull_request:
    paths:
      - '.github/workflows/zara-workflows.yml'
      - 'tests/zara-workflows.sh'
      - 'tests/zara-android-template.sh'
      - 'nix/home-manager/mods/default.nix'
      - 'nix/home-manager/mods/zara.nix'
      - 'nix/home-manager/mods/zara-workflows.nix'
      - 'nix/home-manager/systems/desktop/home.nix'
      - 'flake.nix'
      - 'flake.lock'
      - '.doom.d/config.org'
      - '.doom.d/config.el'
      - '.doom.d/packages.org'
      - '.doom.d/packages.el'
      - 'nix/home-manager/files/zarathushtra/**'
      - '.config/zarathushtra/**'
      - 'nix/nixos/systems/flake/networking.nix'
      - 'zara-template.properties'
      - 'docs/wiki/zara.org'
      - 'docs/wiki/zara-android-automation.org'
      - 'docs/wiki/index.org'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/zara-workflows.yml'
      - 'tests/zara-workflows.sh'
      - 'tests/zara-android-template.sh'
      - 'nix/home-manager/mods/default.nix'
      - 'nix/home-manager/mods/zara.nix'
      - 'nix/home-manager/mods/zara-workflows.nix'
      - 'nix/home-manager/systems/desktop/home.nix'
      - 'flake.nix'
      - 'flake.lock'
      - '.doom.d/config.org'
      - '.doom.d/config.el'
      - '.doom.d/packages.org'
      - '.doom.d/packages.el'
      - 'nix/home-manager/files/zarathushtra/**'
      - '.config/zarathushtra/**'
      - 'nix/nixos/systems/flake/networking.nix'
      - 'zara-template.properties'
      - 'docs/wiki/zara.org'
      - 'docs/wiki/zara-android-automation.org'
      - 'docs/wiki/index.org'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck swi-prolog-nox
      - name: Check shell syntax and policy
        run: |
          set -euo pipefail
          bash -n tests/zara-workflows.sh tests/zara-android-template.sh nix/home-manager/files/zarathushtra/bin/zara-system-update
          shellcheck --severity=warning tests/zara-workflows.sh tests/zara-android-template.sh nix/home-manager/files/zarathushtra/bin/zara-system-update
      - name: Check Zara Prolog base config syntax
        run: swipl -q -t halt -s .config/zarathushtra/config.pl
      - name: Check Zara workflow contract
        run: bash tests/zara-workflows.sh
      - name: Check Zara Android config template
        run: bash tests/zara-android-template.sh

  lock-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Refresh zara-plugins lock candidate
        run: nix flake lock --update-input zara-plugins
      - name: Upload lock candidate
        uses: actions/upload-artifact@v4
        with:
          name: zara-plugins-flake-lock
          path: flake.lock
          retention-days: 1
