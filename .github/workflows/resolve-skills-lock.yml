name: Resolve skills lock

on:
  push:
    branches:
      - feature/global-prolog-agent-policy

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Resolve merged skills input
        run: nix flake update skills
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-skills-lock
          path: flake.lock
