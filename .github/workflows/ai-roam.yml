name: ai-roam

on:
  pull_request:
    paths:
      - "lisp/llm/ai-roam.el"
      - "lisp/llm/ai-roam-test.el"
      - "lisp/llm/ai-roam-links.el"
      - "lisp/llm/ai-roam-links-test.el"
      - "lisp/llm/ai-roam-vector.el"
      - "lisp/llm/ai-roam-vector-test.el"
      - "lisp/llm/ai-roam-chat.el"
      - "lisp/llm/ai-roam-chat-test.el"
      - ".github/workflows/ai-roam.yml"
  push:
    branches:
      - master
      - "agent/**"
    paths:
      - "lisp/llm/ai-roam.el"
      - "lisp/llm/ai-roam-test.el"
      - "lisp/llm/ai-roam-links.el"
      - "lisp/llm/ai-roam-links-test.el"
      - "lisp/llm/ai-roam-vector.el"
      - "lisp/llm/ai-roam-vector-test.el"
      - "lisp/llm/ai-roam-chat.el"
      - "lisp/llm/ai-roam-chat-test.el"
      - ".github/workflows/ai-roam.yml"

permissions:
  contents: read

jobs:
  ai-roam-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Run Emacs ai-roam ERT tests
        run: |
          set -euo pipefail
          nix shell github:NixOS/nixpkgs/nixos-26.05#emacs-nox --command \
            emacs -Q --batch \
              -L lisp/llm \
              -l lisp/llm/ai-roam-test.el \
              -l lisp/llm/ai-roam-links-test.el \
              -l lisp/llm/ai-roam-vector-test.el \
              -l lisp/llm/ai-roam-chat-test.el \
              -f ert-run-tests-batch-and-exit
