name: Nix

on:
  pull_request:
  push:
    branches:
      - master
      - agent/**

permissions:
  contents: read

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix shell .#actionlint -c actionlint .github/workflows/*.yml
      - run: nix flake check --show-trace
      - run: nix build --no-link --print-build-logs
      - run: nix build .#logos-iso --no-link --print-build-logs
