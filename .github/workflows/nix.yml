name: Nix

on:
  pull_request:
  push:
    branches:
      - master
      - agent/**

permissions:
  contents: read
  pull-requests: write

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devops-actions/actionlint@f9ec6b423d04a7f7a9f6872b1a16fd8313a7db62
      - name: Install shell and Qtile test tooling
        run: sudo apt-get update && sudo apt-get install -y emacs-nox shellcheck python3-psutil
      - name: Check shell scripts
        run: |
          set -euo pipefail
          bash -n .bashrc scripts/*.sh tests/home-manager-updater.sh tests/gpt-todos-sync.sh tests/opencode-yolo.sh tests/llm-log-expert-consumer.sh tests/skill-sync.sh .bash_profile .config/bash/git-sync.sh .local/bin/screen-capture tests/screen-capture.sh scripts/agent-zero-tunnel scripts/remote-gui-launch scripts/install-termux-widgets tests/agent-zero-tunnel.sh tests/remote-gui-launch.sh nix/home-manager/files/opencode-yolo.sh
          shellcheck --severity=warning scripts/*.sh tests/home-manager-updater.sh tests/gpt-todos-sync.sh tests/opencode-yolo.sh tests/llm-log-expert-consumer.sh tests/skill-sync.sh .bash_profile .config/bash/git-sync.sh .local/bin/screen-capture tests/screen-capture.sh scripts/agent-zero-tunnel scripts/remote-gui-launch scripts/install-termux-widgets tests/agent-zero-tunnel.sh tests/remote-gui-launch.sh nix/home-manager/files/opencode-yolo.sh
      - name: Run llm-log expert consumer contract
        run: bash tests/llm-log-expert-consumer.sh
      - name: Verify bash.org and .bashrc are tangled in sync
        run: |
          set -euo pipefail
          emacs -Q --batch \
            --eval "(require 'org)" \
            --eval "(org-babel-tangle-file \"bash.org\")"
          git diff --exit-code -- .bashrc
      - name: Verify literate Org sources are tangled in sync
        run: |
          set -euo pipefail
          scripts/check-literate-sync
          tests/literate-sync.sh
      - name: Verify screen-capture literate source is tangled in sync
        run: |
          set -euo pipefail
          emacs -Q --batch \
            --eval "(require 'org)" \
            --eval '(org-babel-tangle-file ".doom.d/autoload/screen-capture.org")'
          git diff --exit-code -- .doom.d/autoload/screen-capture.el
      - name: Run screen capture tests
        run: bash tests/screen-capture.sh
      - name: Run Home Manager updater recovery tests
        run: bash tests/home-manager-updater.sh
      - name: Run skill sync tests
        run: bash tests/skill-sync.sh
      - name: Run GPT TODO bidirectional sync tests
        run: bash tests/gpt-todos-sync.sh
      - name: Run research approval ERT tests
        run: >-
          emacs -Q --batch
          -L .doom.d/autoload
          -l .doom.d/tests/research-approval-test.el
          -f ert-run-tests-batch-and-exit
      - name: Run OpenCode YOLO tmpfs tests
        run: bash tests/opencode-yolo.sh
      - name: Run Brave MCP protocol tests
        run: python3 tests/brave-mcp.py
      - name: Run Termux remote workflow tests
        run: |
          bash tests/agent-zero-tunnel.sh
          bash tests/remote-gui-launch.sh
      - name: Check Qtile Python helpers
        run: >-
          python3 -m py_compile
          .config/qtile/qtile_openrouter.py
          .config/qtile/scripts/openrouter_status.py
      - name: Run Qtile helper tests
        run: python3 -m unittest discover -s .config/qtile/tests -p 'test_*.py'

  image-progress-tests:
    needs: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emacs
        run: sudo apt-get update && sudo apt-get install -y emacs-nox
      - name: Run image progress ERT tests
        run: >-
          emacs -Q --batch
          -L lisp/llm
          -l lisp/llm/ai-image-progress-test.el
          -f ert-run-tests-batch-and-exit

  logos:
    needs: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: nix-community
      - name: Check flake lock is current
        run: |
          set -euo pipefail
          nix flake lock
          git diff -- flake.lock
          git diff --exit-code -- flake.lock
      - name: Evaluate flake checks without building system closures
        run: nix flake check --no-build --show-trace
      - name: Build and test Prolog MCP package
        run: nix build .#checks.x86_64-linux.prolog-mcp --no-link
      - name: Build Brave MCP package
        run: nix build .#checks.x86_64-linux.brave-mcp --no-link
      - name: Evaluate desktop Home Manager configuration
        run: nix eval --raw '.#homeConfigurations."unseen@desktop".activationPackage.drvPath'
      - name: Evaluate flake Home Manager configuration
        run: nix eval --raw '.#homeConfigurations."unseen@flake".activationPackage.drvPath'
