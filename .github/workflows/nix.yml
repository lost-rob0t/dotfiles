name: Nix

on:
  pull_request:
  push:
    branches:
      - master
      - agent/**

permissions:
  contents: read
  pull-requests: write

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devops-actions/actionlint@f9ec6b423d04a7f7a9f6872b1a16fd8313a7db62
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: |
          set -euo pipefail
          bash -n scripts/*.sh tests/home-manager-updater.sh tests/gpt-todos-sync.sh tests/starintel-tunnel.sh .bash_profile .config/bash/git-sync.sh .local/bin/starintel-tunnel .local/bin/starintel-couchdb-tunnel
          shellcheck --severity=warning scripts/*.sh tests/home-manager-updater.sh tests/gpt-todos-sync.sh tests/starintel-tunnel.sh .bash_profile .config/bash/git-sync.sh .local/bin/starintel-tunnel .local/bin/starintel-couchdb-tunnel
      - name: Run Home Manager updater recovery tests
        run: bash tests/home-manager-updater.sh
      - name: Run GPT TODO bidirectional sync tests
        run: bash tests/gpt-todos-sync.sh
      - name: Run StarIntel tunnel tests
        run: bash tests/starintel-tunnel.sh
      - name: Check Qtile Python helpers
        run: >-
          python3 -m py_compile
          .config/qtile/qtile_openrouter.py
          .config/qtile/scripts/openrouter_status.py
      - name: Run Qtile helper tests
        run: python3 -m unittest discover -s .config/qtile/tests -p 'test_*.py'

  image-progress-tests:
    needs: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emacs
        run: sudo apt-get update && sudo apt-get install -y emacs-nox
      - name: Run image progress ERT tests
        run: >-
          emacs -Q --batch
          -L lisp/llm
          -l lisp/llm/ai-image-progress-test.el
          -f ert-run-tests-batch-and-exit

  logos:
    needs: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: nix-community
      - name: Evaluate flake checks without building system closures
        run: nix flake check --no-build --show-trace
      - name: Evaluate desktop Home Manager configuration
        run: nix eval --raw '.#homeConfigurations."unseen@desktop".activationPackage.drvPath'
      - name: Evaluate flake Home Manager configuration
        run: nix eval --raw '.#homeConfigurations."unseen@flake".activationPackage.drvPath'
