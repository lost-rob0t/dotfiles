name: Nix

on:
  pull_request:
  push:
    branches:
      - master
      - agent/**

permissions:
  contents: read
  pull-requests: write

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devops-actions/actionlint@e7ee33fbf5aa8c9f9ee1145137f3e52e25d6a35b

  logos:
    needs: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --show-trace
      - run: nix build --no-link --print-build-logs
      - run: nix build .#logos-iso --no-link --print-build-logs
