name: Refresh skills lock once

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: cachix/install-nix-action@v31
      - name: Update skills input
        run: nix flake update skills
      - name: Commit lock and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/update-skills-lock-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add flake.lock .github/workflows/update-skills-lock-once.yml
          git diff --cached --exit-code && exit 0
          git commit -m 'chore(nix): refresh skills input'
          git push origin HEAD:master
