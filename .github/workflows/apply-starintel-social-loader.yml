name: Apply StarIntel social loader

on:
  push:
    branches:
      - bootstrap/starintel-social-loader

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: bootstrap/starintel-social-loader
          fetch-depth: 0

      - name: Append optional loader to literate and active Doom config
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          loader = ''';; StarIntel Social: optional external editorial workstation.
          (let ((root (getenv "STARINTEL_SOCIAL_ROOT")))
            (when (and root (not (string= root "")))
              (let ((entry (expand-file-name "elisp/starintel-social.el" root)))
                (when (file-readable-p entry)
                  (load entry nil 'nomessage)))))'''

          org_block = f'''\n* StarIntel Social\nThe StarIntel social/editorial workstation is optional. Set\n=STARINTEL_SOCIAL_ROOT= to the checkout root before Emacs starts to enable it.\nWhen the variable is unset, empty, or the checkout is absent, this config does\nnothing. The package exposes its command surface through =M-x starintel-social-menu=.\n\n#+begin_src emacs-lisp\n{loader}\n#+end_src\n'''

          config_org = Path('.doom.d/config.org')
          org_text = config_org.read_text()
          if '* StarIntel Social\n' not in org_text:
              config_org.write_text(org_text.rstrip() + '\n' + org_block)

          config_el = Path('.doom.d/config.el')
          el_text = config_el.read_text()
          if ';; StarIntel Social: optional external editorial workstation.' not in el_text:
              config_el.write_text(el_text.rstrip() + '\n\n' + loader + '\n')

          assert 'STARINTEL_SOCIAL_ROOT' in config_org.read_text()
          assert 'STARINTEL_SOCIAL_ROOT' in config_el.read_text()
          PY

          rm .github/workflows/apply-starintel-social-loader.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .doom.d/config.org .doom.d/config.el .github/workflows/apply-starintel-social-loader.yml
          git diff --cached --check
          git commit -m "Load StarIntel social editor optionally"
          git push origin HEAD:bootstrap/starintel-social-loader
