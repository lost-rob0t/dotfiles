name: Run Doom keymap repair

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/repair-doom-keymaps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply registered repair
        shell: bash
        run: |
          ruby -ryaml -e 'puts YAML.load_file(".github/workflows/repair-doom-keymaps.yml").fetch("jobs").fetch("repair").fetch("steps")[1].fetch("run")' > /tmp/repair-doom-keymaps.sh
          bash /tmp/repair-doom-keymaps.sh

      - name: Verify and push repair branch
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .doom.d
          git commit -m "Fix Doom keybinding namespace collisions"
          git push origin HEAD:${{ github.head_ref }}
