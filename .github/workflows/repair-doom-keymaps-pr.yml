name: Run Doom keymap repair

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/repair-doom-keymaps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply registered repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/repair-doom-keymaps.yml').read_text()
          marker = "python3 - <<'PY'\n"
          script = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          )
          exec(compile(script, 'repair-doom-keymaps.py', 'exec'))
          PY

      - name: Verify and push repair branch
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .doom.d
          git commit -m "Fix Doom keybinding namespace collisions"
          git push origin HEAD:${{ github.head_ref }}
