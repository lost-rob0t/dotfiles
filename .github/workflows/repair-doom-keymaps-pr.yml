name: Run Doom keymap repair

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/repair-doom-keymaps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply Doom keymap repair
        run: python3 .github/scripts/repair-doom-keymaps.py

      - name: Verify and push repair branch
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .doom.d
          git commit -m "Fix Doom keybinding namespace collisions"
          git push origin HEAD:${{ github.head_ref }}
