name: Termux StarIntel client
on:
  pull_request:
    paths:
      - 'bootstrap-termux.*'
      - 'scripts/termux-starintel-client*'
      - 'tests/termux-client.py'
      - 'nix/packages/starintel-admin/**'
      - '.github/workflows/termux-client.yml'
  push:
    branches: [master]
    paths:
      - 'bootstrap-termux.*'
      - 'scripts/termux-starintel-client*'
      - 'tests/termux-client.py'
      - 'nix/packages/starintel-admin/**'
permissions:
  contents: read
jobs:
  client-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host validation tools
        run: sudo apt-get update && sudo apt-get install -y bash coreutils curl jq openssl python3 shellcheck
      - run: python3 tests/termux-client.py
      - run: bash nix/packages/starintel-admin/tests/admin-cli.sh
      - run: shellcheck --severity=warning scripts/termux-starintel-client bootstrap-termux.sh
