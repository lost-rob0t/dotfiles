name: StarIntel module
on:
  pull_request:
    paths:
      - 'nix/home-manager/mods/starintel*'
      - 'nix/home-manager/files/starintel/**'
      - 'tests/starintel-*'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/starintel-module.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Verify literate source
        run: python3 tests/starintel-literate.py
      - name: Evaluate and build module regression check
        run: nix build .#checks.x86_64-linux.starintel-module --no-write-lock-file --print-build-logs
  live-stack:
    needs: module
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build pinned packages and smoke disposable stack
        run: python3 tests/starintel-live.py --artifacts "$RUNNER_TEMP/starintel-live-logs"
      - name: Upload sanitized live-stack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starintel-live-evidence
          path: ${{ runner.temp }}/starintel-live-logs
          if-no-files-found: warn
          retention-days: 7
  chatgpt-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build ChatGPT with dotfiles nixpkgs
        run: |
          nix build --impure --print-build-logs --expr \
            'let f = builtins.getFlake (toString ./.); in f.inputs.chatgpt-desktop.packages.x86_64-linux.default'
          test -x result/lib/chatgpt/ChatGPT
          interpreter=$(nix run --impure --expr \
            'let f = builtins.getFlake (toString ./.); in f.inputs.nixpkgs.legacyPackages.x86_64-linux.patchelf' \
            -- --print-interpreter result/lib/chatgpt/ChatGPT)
          "$interpreter" --list "$(readlink -f result)/lib/chatgpt/ChatGPT" | tee /tmp/chatgpt-consumer-libraries.txt
          ! grep -q 'not found' /tmp/chatgpt-consumer-libraries.txt
