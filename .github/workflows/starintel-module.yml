name: StarIntel module
on:
  pull_request:
    paths:
      - 'nix/home-manager/mods/starintel*'
      - 'nix/home-manager/files/starintel/**'
      - 'tests/starintel-*'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/starintel-module.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Verify literate source
        run: python3 tests/starintel-literate.py
      - name: Evaluate and build module regression check
        run: nix build .#checks.x86_64-linux.starintel-module --no-write-lock-file --print-build-logs
